<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f59e0b" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>Itajubá Flat Hotel — Conforto de Hotel com Praticidade de Flat em Itajubá / MG</title>
    <meta name="description" content="Site oficial do Itajubá Flat Hotel (www.itajubaflat.com.br). Reserve seu flat mobiliado com mini-cozinha, Wi-Fi fibra, café da manhã colonial mineiro e excelente localização no centro de Itajubá." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <style>
      #bootstrap-status { min-height: 100vh; display: grid; place-items: center; background: #0c0a09; color: #f5f5f4; padding: 24px; font-family: system-ui, sans-serif; }
      #bootstrap-status > div { width: 100%; max-width: 620px; border: 1px solid #44403c; border-radius: 20px; background: #1c1917; padding: 28px; }
      #bootstrap-error { display: none; margin-top: 14px; white-space: pre-wrap; overflow-wrap: anywhere; border-radius: 12px; background: #0c0a09; padding: 14px; color: #fda4af; font-size: 12px; }
    </style>
    <script>
      (() => {
        const showBootstrapError = (message) => {
          const error = document.getElementById('bootstrap-error');
          const title = document.getElementById('bootstrap-title');
          const detail = document.getElementById('bootstrap-detail');
          if (title) title.textContent = 'Falha ao carregar o Hotel OS';
          if (detail) detail.textContent = 'O HTML foi carregado, mas o JavaScript principal não conseguiu iniciar. Copie a mensagem abaixo para diagnóstico.';
          if (error) {
            error.style.display = 'block';
            error.textContent = message || 'Falha desconhecida durante o bootstrap.';
          }
        };

        window.__hotelOsBootstrapError = showBootstrapError;
        window.addEventListener('error', (event) => {
          const target = event.target;
          if (target instanceof HTMLScriptElement) {
            showBootstrapError(`Falha ao carregar script: ${target.src || '(sem URL)'}`);
            return;
          }
          if (event.error || event.message) showBootstrapError(event.error?.message || event.message);
        }, true);
        window.addEventListener('unhandledrejection', (event) => {
          const reason = event.reason instanceof Error ? event.reason.message : String(event.reason || 'Promise rejeitada sem detalhe.');
          showBootstrapError(reason);
        });

        try {
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations()
              .then(registrations => Promise.all(registrations.map(registration => registration.unregister())))
              .catch(() => undefined);
          }
          if ('caches' in window) {
            caches.keys()
              .then(keys => Promise.all(keys.filter(key => key.startsWith('hotel-os-shell-')).map(key => caches.delete(key))))
              .catch(() => undefined);
          }
        } catch (_) {
          // O bootstrap principal continua mesmo se a limpeza não estiver disponível.
        }
      })();
    </script>
  </head>
  <body class="bg-stone-50 text-stone-900 antialiased selection:bg-amber-200 selection:text-amber-900">
    <div id="root">
      <div id="bootstrap-status">
        <div>
          <h1 id="bootstrap-title" style="margin:0 0 10px;font-size:22px;">Carregando Hotel OS…</h1>
          <p id="bootstrap-detail" style="margin:0;color:#d6d3d1;line-height:1.5;">Preparando a aplicação.</p>
          <pre id="bootstrap-error"></pre>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
