# Configuração do Apache VirtualHost para goncalves.guiadamantiqueira.com.br
# Arquivo no servidor: /etc/apache2/sites-available/goncalves.guiadamantiqueira.com.br.conf

<VirtualHost *:80>
    ServerName goncalves.guiadamantiqueira.com.br
    DocumentRoot /var/www/goncalves.guiadamantiqueira.com.br/public_html

    <Directory /var/www/goncalves.guiadamantiqueira.com.br/public_html>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Redirecionamento automático HTTP para HTTPS
    RewriteEngine On
    RewriteCond %{HTTPS} off
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]

    ErrorLog ${APACHE_LOG_DIR}/goncalves_error.log
    CustomLog ${APACHE_LOG_DIR}/goncalves_access.log combined
</VirtualHost>

# VirtualHost SSL (Gerado automaticamente pelo Certbot / Let's Encrypt)
<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName goncalves.guiadamantiqueira.com.br
    DocumentRoot /var/www/goncalves.guiadamantiqueira.com.br/public_html

    <Directory /var/www/goncalves.guiadamantiqueira.com.br/public_html>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    SSLEngine on
    # Os caminhos abaixo serão configurados pelo certbot:
    # SSLCertificateFile /etc/letsencrypt/live/goncalves.guiadamantiqueira.com.br/fullchain.pem
    # SSLCertificateKeyFile /etc/letsencrypt/live/goncalves.guiadamantiqueira.com.br/privkey.pem

    ErrorLog ${APACHE_LOG_DIR}/goncalves_ssl_error.log
    CustomLog ${APACHE_LOG_DIR}/goncalves_ssl_access.log combined
</VirtualHost>
</IfModule>
