name: Temporary phase 9 remaining finance audit
on:
  push:
    branches:
      - audit/phase9-remaining-finance
permissions:
  contents: write
jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/phase9-remaining-finance
      - name: Audit remaining finance components
        shell: bash
        run: |
          {
            echo '=== FINANCIAL MODULE IMPORTS ==='
            grep -nE '^import .*financial/|from .*/financial/' src/components/admin/FinancialModule.tsx || true
            echo '=== LEGACY COMPONENT REFERENCES ==='
            for symbol in PixConfigTab CreditCardGatewaysTab PaymentLinkModal NewExpenseModal NewReceivableModal FinancialOverviewTab ReceivablesCrmTab PayablesTab TransactionsAuditTab ReceiptModal; do
              echo "--- $symbol ---"
              grep -RIn "$symbol" src --include='*.ts' --include='*.tsx' || true
            done
            echo '=== FINANCIAL FILES ==='
            find src/components/admin/financial -maxdepth 1 -type f -printf '%f\n' | sort
            echo '=== UNAVAILABLE PAYMENT CONFIG ==='
            grep -nE 'UnavailablePaymentConfigPanel|pix_config|gateways|PaymentLink|NewExpense|NewReceivable' src/components/admin/FinancialModule.tsx || true
          } > phase9-remaining-finance.txt
      - name: Commit audit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add phase9-remaining-finance.txt
          git commit -m "chore: registrar auditoria financeira restante"
          git push origin HEAD:audit/phase9-remaining-finance
